<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>study | Tea Ceremony</title>
    <meta name="description" content="Interior Designのお問い合わせページです。ご不明点やご質問などございましたらお気軽にお問い合わせください。">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="img/common/otya-icon.ico">
    <link rel="apple-touch-icon" href="img/common/otya-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@400&display=swap" rel="stylesheet">
  
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道具の名前クイズ</title>
<style>
  body {
    font-family: "Yu Gothic", sans-serif;
    text-align: center;
    background: #f9f9f9;
    padding: 20px;
  }
  h1 {
    color: #3b3b3b;
  }
  img {
    width: 80%;
    max-width: 300px;
    border-radius: 12px;
    margin: 15px 0;
    box-shadow: 0 0 8px rgba(0,0,0,0.2);
  }
  .choice-btn {
    display: block;
    width: 80%;
    max-width: 300px;
    margin: 10px auto;
    padding: 10px;
    border: 2px solid #4b8b3b;
    border-radius: 10px;
    background: #e8f5e4;
    cursor: pointer;
    font-size: 1.1rem;
    transition: 0.3s;
  }
  .choice-btn:hover {
    background: #d7f0d0;
  }
  #result {
    margin-top: 15px;
    font-weight: bold;
  }
  button#nextBtn {
    margin-top: 15px;
    padding: 10px 25px;
    background-color: #6fa3ef;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    display: none;
  }
  button#retryBtn, button#backBtn {
    margin-top: 10px;
    padding: 10px 25px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
  }
  #retryBtn {
    background-color: #f0b429;
    color: white;
  }
  #backBtn {
    background-color: #4b8b3b;
    color: white;
  }
</style>
</head>
<body>

<h1>道具の名前クイズ</h1>
<p id="questionText">第1問：これは何のお茶道具？</p>
<img id="quizImage" src="img/game/chawan.png" alt="茶道具">

<div id="choices"></div>
<p id="result"></p>
<button id="nextBtn" onclick="nextQuestion()">次へ ▶</button>

<script>
const questions = [
  { question: "これは何のお茶道具？", img: "img/game/chawan.png", options: ["A:茶碗","B:茶杓","C:茶筅","D:懐紙"], answer: "A:茶碗" },
  { question: "これは何のお茶道具？", img: "img/game/chasen.png", options: ["A:茶碗","B:茶杓","C:茶筅","D:花入"], answer: "C:茶筅" },
  { question: "これは何のお茶道具？", img: "img/game/chashaku.png", options: ["A:茶碗","B:茶杓","C:茶筅","D:掛物"], answer: "B:茶杓" },
  { question: "これは何のお茶道具？", img: "img/game/kaisi.png", options: ["A:懐紙","B:茶碗","C:茶杓","D:花入"], answer: "A:懐紙" },
 <!-- { question: "これは何のお茶道具？", img: "img/game/kakeziku.png", options: ["A:掛物","B:茶杓","C:茶筅","D:花入"], answer: "A:掛物" },-->
  { question: "これは何のお茶道具？", img: "img/game/hanaire.png", options: ["A:茶碗","B:茶杓","C:懐紙","D:花入"], answer: "D:花入" },
  { question: "これは何のお茶道具？", img: "img/game/kensui.png", options: ["A:建水","B:茶杓","C:茶筅","D:掛物"], answer: "A:建水" },
  { question: "これは何のお茶道具？", img: "img/game/natume.png", options: ["A:茶碗","B:棗","C:茶杓","D:花入"], answer: "B:棗" },
  { question: "これは何のお茶道具？", img: "img/game/fukusa.png", options: ["A:懐紙","B:茶杓","C:茶碗","D:袱紗"], answer: "D:袱紗" },
  { question: "これは何のお茶道具？", img: "img/game/hishaku.png", options: ["A:茶碗","B:棗","C:柄杓","D:花入"], answer: "C:柄杓" }
];

let current = 0;
let score = 0;
let answered = false;

function loadQuestion() {
  const q = questions[current];
  document.getElementById("quizImage").src = q.img;
  document.getElementById("questionText").textContent = `第${current + 1}問：${q.question}`;
  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";
  document.getElementById("result").textContent = "";
  document.getElementById("nextBtn").style.display = "none";
  answered = false;

  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.textContent = opt;
    btn.className = "choice-btn";
    btn.onclick = () => checkAnswer(opt);
    choicesDiv.appendChild(btn);
  });
}

function checkAnswer(selected) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const result = document.getElementById("result");
  if (selected === q.answer) {
    score++;
    result.textContent = "✅ 正解！";
    result.style.color = "green";
  } else {
    result.textContent = `❌ 残念！正解は「${q.answer}」です。`;
    result.style.color = "red";
  }
  document.getElementById("nextBtn").style.display = "inline-block";
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.body.innerHTML = `
    <h1>結果発表🎉</h1>
    <p>あなたの正解数は <strong>${score} / ${questions.length}</strong> でした！</p>
    <p>${score === 10 ? "完璧です！茶道具マスターですね。" :
       score >= 7 ? "とてもよくできました！" :
       score >= 4 ? "あと少しで完璧です。" :
       "もう一度挑戦してみましょう。"} </p>
    <button id="retryBtn" onclick="location.reload()">🔄 もう一度挑戦</button>
    <button id="backBtn" onclick="location.href='map.html'">マップに戻る</button>
    <button id="backBtn" onclick="location.href='doug.html'">道具の確認</button>
  `;
}

// 最初の問題をロード
loadQuestion();
</script>

</body>
</html>
